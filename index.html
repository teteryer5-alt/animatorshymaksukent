<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Студия праздника «Валерия» — Аксукент</title>
    <style>
        /* Базовые сбросы и стили */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            scroll-behavior: smooth;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #0b0705;
            color: #ffffff;
        }
        body {
            background-color: #0b0705;
            overflow-x: hidden;
        }

        /* Анимация появления элементов */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Типографика */
        h1, h2, h3 {
            font-family: "Georgia", serif;
            font-weight: 400;
        }
        .meta-tag {
            color: #b58969;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 0.75rem;
            margin-bottom: 16px;
            display: block;
        }

        /* Шапка сайта */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(11, 7, 5, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .logo-block {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-img {
            width: 38px;
            height: 38px;
            object-fit: cover;
            border-radius: 50%;
            border: 1px solid #b58969;
            flex-shrink: 0;
        }
        .logo-title {
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.85rem;
            color: #fff;
        }
        .logo-subtitle {
            font-size: 0.6rem;
            color: #b58969;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }
        .header-slogan {
            display: none;
            color: #a09085;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }
        .btn-header {
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .btn-header:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #ffffff;
        }

        /* Главный экран (Hero) */
        #hero {
            min-height: 100vh;
            padding: 100px 20px 50px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle at 90% 40%, #3a2214 0%, #0b0705 60%);
        }
        #hero h1 {
            font-size: 2.1rem;
            max-width: 700px;
            line-height: 1.25;
            margin-bottom: 15px;
        }
        .sub-text {
            color: #a09085;
            font-size: 0.95rem;
            max-width: 480px;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .btn-main {
            background-color: #e3bc9a;
            color: #1a0f0a;
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 30px;
            font-weight: 600;
            display: inline-block;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        .btn-main:hover {
            background-color: #d4aa87;
            transform: translateY(-2px);
        }

        /* Заголовок каталога */
        #catalog {
            padding: 60px 20px 20px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            max-width: 1200px;
            margin: 0 auto;
        }
        .catalog-head {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .catalog-head h2 {
            font-size: 2rem;
        }
        .side-info {
            color: #a09085;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        /* Блоки программ */
        .collection-section {
            min-height: auto;
            display: flex;
            flex-direction: column-reverse;
            justify-content: center;
            align-items: center;
            gap: 25px;
            padding: 50px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            max-width: 1200px;
            margin: 0 auto;
        }
        .col-left {
            width: 100%;
        }
        .col-right {
            width: 100%;
            display: flex;
            justify-content: center;
        }
        .collection-section h3 {
            font-size: 1.7rem;
            margin: 10px 0 15px 0;
        }
